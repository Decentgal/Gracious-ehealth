name: "eHealth Benchmark Security Pipeline"

on:
  push:
    branches: 
      - main

    paths:
      - 'terraform/**'


permissions:
  id-token: write      # Required for OIDC handshake
  contents: read       # Required for checking out code
  issues: write        # Required for ZAP reports

jobs:
  devsecops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. IaC SCANNING (Checkov)
      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false 
          output_format: sarif
          output_file_paths: results_sarif

      # 2. AWS AUTHENTICATION
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 3. INFRASTRUCTURE DEPLOYMENT
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      # 4. CONTAINER SECURITY (Trivy)
      - name: Build and Scan Docker Image
        run: |
          docker build -t ehealth-app .
          # Scan Dockerfile misconfigs
          docker run --rm aquasecurity/trivy config .
          # Scan Image for vulnerabilities
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy image --exit-code 1 --severity CRITICAL,HIGH ehealth-app

      # 5. PERMISSION ENFORCEMENT (The "Fix")
      - name: Fix Workspace Permissions
        if: always()
        run: |
          echo "Reclaiming workspace from root-owned scanner outputs..."
          sudo chown -R $USER:$USER .


      # 6. DYNAMIC ANALYSIS (OWASP ZAP)
      - name: Start Container for DAST
        run: docker run -d --name test-container -p 5000:5000 ehealth-app

      - name: Run OWASP ZAP (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:5000'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false

      - name: Stop Container
        if: always()
        run: docker rm -f test-container